services:
  # =============================================
  # POSTGRES DATABASE SERVICE
  # =============================================
  db:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: orvi27
      POSTGRES_PASSWORD: password
      POSTGRES_DB: employee_db
      PGDATA: /data/postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5332:5432"   # host:container
    networks:
      - app-network
    restart: unless-stopped

  # =============================================
  # REDIS SERVICE
  # =============================================
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass your_redis_password
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # =============================================
  # SPRING BOOT APPLICATION SERVICE
  # =============================================
  app:
    build: .
    container_name: springboot-jwt-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/employee_db
      SPRING_DATASOURCE_USERNAME: orvi27
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: your_redis_password
    networks:
      - app-network
    restart: unless-stopped

# =============================================
# NETWORK AND VOLUME CONFIGURATION
# =============================================
networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local